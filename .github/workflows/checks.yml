name: checks
on: [push, pull_request]
jobs:
  attacks-and-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # prove-flaws.sh needs the as-delivered tag
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: 'Fixed app: every attack refused, normal use works'
        run: php artisan test
      - name: 'App as delivered: every attack works'
        run: bash scripts/prove-flaws.sh
      # Advisories published after this demo was written are reported without failing the run.
      - run: composer audit
        continue-on-error: true
